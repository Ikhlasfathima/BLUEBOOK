<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BLUEBOOK - My Marks</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --blue-50:#EFF4FF;--blue-100:#D6E3FF;--blue-400:#4A7CF7;--blue-500:#3060E0;--blue-600:#2149C0;
            --slate-50:#F8FAFC;--slate-100:#F1F4F9;--slate-200:#E4E9F2;--slate-300:#CBD3E0;
            --slate-400:#8A96AD;--slate-600:#4A5568;--slate-700:#2D3748;--slate-800:#1E2535;
            --white:#FFFFFF;
            --green-50:#F0FDF4;--green-100:#DCFCE7;--green-600:#15803D;--green-700:#166534;
            --amber-50:#FFFBEB;--amber-100:#FEF3C7;--amber-600:#B45309;
            --red-50:#FEF2F2;--red-100:#FEE2E2;--red-600:#B91C1C;
            --radius:12px;--radius-sm:8px;
        }
        body{font-family:'DM Sans',sans-serif;background:var(--slate-100);min-height:100vh;color:var(--slate-800);}
        nav{background:var(--white);border-bottom:1px solid var(--slate-200);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
        .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
        .nav-icon{width:32px;height:32px;background:var(--blue-400);border-radius:8px;display:flex;align-items:center;justify-content:center;}
        .nav-icon svg{width:18px;height:18px;fill:white;}
        .nav-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--slate-800);}
        .nav-badge{font-size:11px;font-weight:500;background:var(--blue-50);color:var(--blue-600);padding:3px 10px;border-radius:20px;border:1px solid var(--blue-100);}
        .nav-actions{display:flex;align-items:center;gap:6px;}
        .nav-btn{padding:7px 15px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:all 0.15s;}
        .nav-btn-ghost{background:transparent;color:var(--slate-600);}
        .nav-btn-ghost:hover{background:var(--slate-100);}
        .nav-btn-ghost.active{background:var(--blue-50);color:var(--blue-500);border-color:var(--blue-100);}
        .nav-btn-outline{background:transparent;color:var(--slate-600);border-color:var(--slate-200);}
        .nav-btn-outline:hover{border-color:var(--slate-300);background:var(--slate-50);}
        .page-wrap{max-width:820px;margin:0 auto;padding:40px 24px 60px;}
        .page-header{margin-bottom:24px;}
        .page-header h2{font-family:'Playfair Display',serif;font-size:24px;color:var(--slate-800);margin-bottom:3px;}
        .page-header p{font-size:14px;color:var(--slate-400);}
        .sub-card{background:var(--white);border:1px solid var(--slate-200);border-radius:var(--radius);padding:20px 24px;margin-bottom:14px;}
        .sub-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
        .sub-title{font-size:15px;font-weight:500;color:var(--slate-700);}
        .sub-id-label{font-size:12px;color:var(--slate-400);}
        .marks-badge{font-size:13px;font-weight:500;padding:4px 14px;border-radius:20px;}
        .marks-badge.high{background:var(--green-50);color:var(--green-700);border:1px solid var(--green-100);}
        .marks-badge.mid{background:var(--amber-50);color:var(--amber-600);border:1px solid var(--amber-100);}
        .marks-badge.low{background:var(--red-50);color:var(--red-600);border:1px solid var(--red-100);}
        .marks-badge.pending{background:var(--slate-100);color:var(--slate-400);border:1px solid var(--slate-200);}
        .sub-content{font-size:14px;color:var(--slate-600);line-height:1.7;background:var(--slate-50);border:1px solid var(--slate-200);border-radius:var(--radius-sm);padding:12px 14px;max-height:110px;overflow-y:auto;}
        .empty-state{text-align:center;padding:56px 24px;background:var(--white);border:1px solid var(--slate-200);border-radius:var(--radius);}
        .empty-state h3{font-size:17px;color:var(--slate-600);margin-bottom:5px;}
        .empty-state p{font-size:14px;color:var(--slate-400);}
        .loading{text-align:center;padding:48px;color:var(--slate-400);font-size:14px;}
    </style>
</head>
<body>
<nav>
    <a class="nav-brand" href="/editor">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h10.5a2 2 0 0 1 2 2v1.5M4 4v16h12.5a2 2 0 0 0 2-2V7.5M4 4H2m16.5 3.5H4"/><rect x="7" y="10" width="7" height="1.5" rx="0.75"/><rect x="7" y="13" width="5" height="1.5" rx="0.75"/></svg>
        </div>
        <span class="nav-title">BLUEBOOK</span>
    </a>
    <div class="nav-actions">
        <span class="nav-badge">Student</span>
        <button class="nav-btn nav-btn-ghost" onclick="window.location.href='/editor'">Editor</button>
        <button class="nav-btn nav-btn-ghost active">My Marks</button>
        <button class="nav-btn nav-btn-outline" onclick="logout()">Sign Out</button>
    </div>
</nav>
<div class="page-wrap">
    <div class="page-header">
        <h2>My Submissions & Marks</h2>
        <p>Review your submitted assignments and the marks awarded by your teacher.</p>
    </div>
    <div id="results"><div class="loading">Loading your submissions…</div></div>
</div>
<script>
const API_BASE = "https://bluebook-gg5l.onrender.com";
let user  = JSON.parse(localStorage.getItem('user'));
let token = localStorage.getItem('token');
if(!user || !token) window.location.href='/auth';
function logout(){ localStorage.clear(); window.location.href='/auth'; }

fetch(`${API_BASE}/my-submissions/`+user.id, {
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token }
})
.then(r=>r.json())
.then(data=>{
    let c=document.getElementById('results');
    c.innerHTML='';
    if(!data||data.length===0){
        c.innerHTML='<div class="empty-state"><h3>No submissions yet</h3><p>Head to the Editor to submit your first assignment.</p></div>';
        return;
    }
    data.forEach(sub=>{
        let hasMarks=sub.marks!==null&&sub.marks!==undefined;
        let pct=hasMarks&&sub.max_marks?Math.round((sub.marks/sub.max_marks)*100):null;
        let badgeClass=!hasMarks?'pending':pct>=75?'high':pct>=50?'mid':'low';
        let marksText=hasMarks?(sub.marks+(sub.max_marks?' / '+sub.max_marks:'')):'Pending';
        let title=sub.assignment_title||('Assignment #'+sub.assignment_id);
        c.innerHTML+=`
        <div class="sub-card">
            <div class="sub-header">
                <div>
                    <div class="sub-title">${title}</div>
                    <div class="sub-id-label">Submission #${sub.submission_id||sub.assignment_id}</div>
                </div>
                <div class="marks-badge ${badgeClass}">Marks: ${marksText}</div>
            </div>
            <div class="sub-content">${sub.content}</div>
        </div>`;
    });
})
.catch(()=>{ document.getElementById('results').innerHTML='<div class="loading">Could not load submissions.</div>'; });
</script>
</body>
</html>
