version: '3.9'

services:

  backend:
    build: .
    container_name: bluebook_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/bluebook_db

  frontend:
    image: python:3.11
    container_name: bluebook_frontend
    working_dir: /app
    volumes:
      - .:/app
    command: python -m http.server 8001
    ports:
      - "8001:8001"

  postgres:
    image: postgres:15
    container_name: bluebook_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bluebook_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: