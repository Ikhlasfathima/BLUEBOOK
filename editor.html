<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BLUEBOOK - Student Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --blue-50:#EFF4FF;--blue-100:#D6E3FF;--blue-400:#4A7CF7;--blue-500:#3060E0;--blue-600:#2149C0;
            --slate-50:#F8FAFC;--slate-100:#F1F4F9;--slate-200:#E4E9F2;--slate-300:#CBD3E0;
            --slate-400:#8A96AD;--slate-600:#4A5568;--slate-700:#2D3748;--slate-800:#1E2535;
            --white:#FFFFFF;--green-50:#F0FDF4;--green-600:#15803D;
            --red-50:#FEF2F2;--red-600:#B91C1C;--amber-50:#FFFBEB;--amber-400:#FBBF24;
            --radius:12px;--radius-sm:8px;
        }
        body{font-family:'DM Sans',sans-serif;background:var(--slate-100);min-height:100vh;color:var(--slate-800);}
        nav{background:var(--white);border-bottom:1px solid var(--slate-200);padding:0 28px;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
        .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
        .nav-icon{width:32px;height:32px;background:var(--blue-400);border-radius:8px;display:flex;align-items:center;justify-content:center;}
        .nav-icon svg{width:18px;height:18px;fill:none;stroke:white;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
        .nav-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--slate-800);}
        .nav-badge{font-size:11px;font-weight:500;background:var(--blue-50);color:var(--blue-600);padding:3px 10px;border-radius:20px;border:1px solid var(--blue-100);}
        .nav-actions{display:flex;align-items:center;gap:6px;}
        .nav-btn{padding:7px 15px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:all 0.15s;}
        .nav-btn-ghost{background:transparent;color:var(--slate-600);}
        .nav-btn-ghost:hover{background:var(--slate-100);color:var(--slate-800);}
        .nav-btn-outline{background:transparent;color:var(--slate-600);border-color:var(--slate-200);}
        .nav-btn-outline:hover{border-color:var(--slate-300);background:var(--slate-50);}
        .page-tabs{display:flex;border-bottom:2px solid var(--slate-200);background:var(--white);padding:0 28px;}
        .page-tab{padding:14px 20px;font-size:14px;font-weight:500;color:var(--slate-400);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;}
        .page-tab:hover{color:var(--slate-700);}
        .page-tab.active{color:var(--blue-500);border-bottom-color:var(--blue-400);}
        .page-wrap{max-width:1100px;margin:0 auto;padding:40px 32px 60px;}
        .tab-panel{display:none;} .tab-panel.active{display:block;}
        .page-header{margin-bottom:24px;}
        .page-header h2{font-family:'Playfair Display',serif;font-size:28px;color:var(--slate-800);margin-bottom:4px;}
        .page-header p{font-size:14px;color:var(--slate-400);}
        .card{background:var(--white);border:1px solid var(--slate-200);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;}
        .card-label{font-size:11px;font-weight:500;color:var(--slate-400);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px;}
        input[type="number"],input[type="text"]{width:100%;padding:10px 13px;border:1.5px solid var(--slate-200);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--slate-800);background:var(--white);outline:none;transition:border-color 0.15s;}
        input:focus{border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(74,124,247,0.1);}
        input::placeholder{color:var(--slate-400);}
        .editor-card{background:var(--white);border:1px solid var(--slate-200);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;}
        .toolbar{display:flex;flex-wrap:wrap;gap:2px;padding:10px 12px;background:var(--slate-50);border-bottom:1px solid var(--slate-200);align-items:center;}
        .tb-group{display:flex;align-items:center;gap:2px;padding-right:8px;margin-right:6px;border-right:1px solid var(--slate-200);}
        .tb-group:last-child{border-right:none;padding-right:0;margin-right:0;}
        .tb-btn{padding:5px 8px;background:transparent;border:none;border-radius:5px;cursor:pointer;font-size:13px;color:var(--slate-600);transition:all 0.12s;line-height:1;display:flex;align-items:center;justify-content:center;min-width:28px;height:28px;}
        .tb-btn:hover{background:var(--slate-200);color:var(--slate-800);}
        .tb-select{padding:4px 6px;border:1px solid var(--slate-200);border-radius:5px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--slate-600);background:var(--white);cursor:pointer;outline:none;height:28px;}
        .tb-label{font-size:11px;color:var(--slate-400);margin:0 4px;}
        #editor{min-height:340px;padding:24px 28px;font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.8;color:var(--slate-800);outline:none;background:var(--white);overflow-y:auto;}
        #editor:empty::before{content:"Start writing your assignment here\2026";color:var(--slate-300);pointer-events:none;}
        .pasted{background-color:#FFFBEB;border-bottom:2px solid var(--amber-400);padding-bottom:1px;}
        .submit-row{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--slate-50);border-top:1px solid var(--slate-200);flex-wrap:wrap;gap:12px;}
        .btn-primary{padding:10px 24px;background:var(--blue-400);color:white;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.15s;}
        .btn-primary:hover{background:var(--blue-500);}
        #stats{font-size:13px;color:var(--slate-600);}
        .warning{color:var(--red-600);font-weight:500;}
        .success{color:var(--green-600);font-weight:500;}
        .stats-card{display:none;padding:16px 24px;background:var(--slate-50);border-top:1px solid var(--slate-200);}
        .stats-card.visible{display:flex;gap:28px;flex-wrap:wrap;}
        .stat-item{flex:1;min-width:110px;}
        .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--slate-400);margin-bottom:4px;}
        .stat-value{font-size:20px;font-weight:500;color:var(--slate-800);}
        .stat-sub{font-size:12px;color:var(--slate-400);}
        .bar-track{height:6px;background:var(--slate-200);border-radius:99px;margin-top:8px;overflow:hidden;}
        .bar-fill{height:100%;border-radius:99px;transition:width 0.4s ease;}
        .bar-typed{background:var(--blue-400);} .bar-pasted{background:var(--amber-400);}

        /* Assignment Cards */
        .assign-card{
            background:var(--white);
            border:1px solid var(--slate-200);
            border-radius:16px;
            padding:20px 24px;
            margin-bottom:14px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:24px;
        }
        .assign-info{flex:1;}
        .assign-title{font-size:15px;font-weight:500;color:var(--slate-800);margin-bottom:6px;}
        .assign-meta{font-size:12px;color:var(--slate-400);display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
        .assign-badge{font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px;white-space:nowrap;}
        .badge-open{background:var(--green-50);color:var(--green-600);border:1px solid #DCFCE7;}
        .badge-closed{background:var(--red-50);color:var(--red-600);border:1px solid #FEE2E2;}
        .assign-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
        .assign-use-btn{padding:8px 18px;background:var(--blue-50);color:var(--blue-600);border:1.5px solid var(--blue-100);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
        .assign-use-btn:hover{background:var(--blue-400);color:white;border-color:var(--blue-400);}
        .deadline-warn{font-size:12px;color:var(--red-600);font-weight:500;}

        .empty-state{background:var(--white);border:1px solid var(--slate-200);border-radius:var(--radius);padding:48px 24px;text-align:center;}
        .empty-state h3{font-size:17px;color:var(--slate-600);margin-bottom:5px;}
        .empty-state p{font-size:14px;color:var(--slate-400);}
        .loading{text-align:center;padding:40px;color:var(--slate-400);font-size:14px;}
    </style>
</head>
<body>

<nav>
    <a class="nav-brand" href="/editor">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
        </div>
        <span class="nav-title">BLUEBOOK</span>
    </a>
    <div class="nav-actions">
        <span class="nav-badge">Student</span>
        <button class="nav-btn nav-btn-ghost" onclick="window.location.href='/marks'">My Marks</button>
        <button class="nav-btn nav-btn-outline" onclick="logout()">Sign Out</button>
    </div>
</nav>

<div class="page-tabs">
    <div class="page-tab active" id="tab-editor" onclick="showTab('editor')">Editor</div>
    <div class="page-tab" id="tab-tasks" onclick="showTab('tasks')">My Assignments</div>
</div>

<div class="page-wrap">

    <!-- EDITOR TAB -->
    <div class="tab-panel active" id="panel-editor">
        <div class="page-header">
            <h2>Assignment Editor</h2>
            <p>Write and submit your assignment. Pasted content is highlighted automatically.</p>
        </div>

        <div class="card">
            <div class="card-label">Assignment ID</div>
            <input type="number" id="assignmentId" placeholder="Enter the assignment ID from your task list">
        </div>

        <div class="editor-card">
            <div class="toolbar">
                <div class="tb-group">
                    <select class="tb-select" onchange="formatBlock(this.value);this.value=''">
                        <option value="">Paragraph</option>
                        <option value="h1">Heading 1</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="p">Normal</option>
                    </select>
                </div>
                <div class="tb-group">
                    <span class="tb-label">Size</span>
                    <select class="tb-select" onchange="setFontSize(this.value);this.value=''">
                        <option value="">Default</option>
                        <option value="12px">12</option>
                        <option value="14px">14</option>
                        <option value="16px">16</option>
                        <option value="18px">18</option>
                        <option value="20px">20</option>
                        <option value="24px">24</option>
                    </select>
                </div>
                <div class="tb-group">
                    <button class="tb-btn" title="Bold" onclick="fmt('bold')"><b>B</b></button>
                    <button class="tb-btn" title="Italic" onclick="fmt('italic')"><i>I</i></button>
                    <button class="tb-btn" title="Underline" onclick="fmt('underline')"><u>U</u></button>
                    <button class="tb-btn" title="Strikethrough" onclick="fmt('strikeThrough')"><s>S</s></button>
                </div>
                <div class="tb-group">
                    <button class="tb-btn" title="Left" onclick="fmt('justifyLeft')">[L]</button>
                    <button class="tb-btn" title="Center" onclick="fmt('justifyCenter')">[C]</button>
                    <button class="tb-btn" title="Right" onclick="fmt('justifyRight')">[R]</button>
                </div>
                <div class="tb-group">
                    <button class="tb-btn" title="Bullet list" onclick="fmt('insertUnorderedList')">&#8226;-</button>
                    <button class="tb-btn" title="Numbered list" onclick="fmt('insertOrderedList')">1-</button>
                    <button class="tb-btn" title="Indent" onclick="fmt('indent')">&nbsp;&#8594;|</button>
                    <button class="tb-btn" title="Outdent" onclick="fmt('outdent')">|&#8592;</button>
                </div>
                <div class="tb-group">
                    <span class="tb-label">Color</span>
                    <input type="color" title="Text color" style="width:28px;height:28px;border:1px solid var(--slate-200);border-radius:5px;padding:2px;cursor:pointer;" onchange="setColor(this.value)">
                </div>
                <div class="tb-group">
                    <button class="tb-btn" title="Insert image" onclick="triggerImageUpload()">[IMG]</button>
                    <input type="file" id="imgUpload" accept="image/*" style="display:none" onchange="insertImage(this)">
                </div>
                <div class="tb-group">
                    <button class="tb-btn" title="Clear formatting" onclick="fmt('removeFormat')">[x]</button>
                </div>
            </div>

            <div id="editor" contenteditable="true" spellcheck="true"></div>

            <div class="submit-row">
                <button class="btn-primary" onclick="submitAssignment()">Submit Assignment</button>
                <div id="stats"></div>
            </div>
            <div class="stats-card" id="statsCard">
                <div class="stat-item">
                    <div class="stat-label">Typed</div>
                    <div class="stat-value" id="stTyped">0</div>
                    <div class="stat-sub" id="stTypedPct">0%</div>
                    <div class="bar-track"><div class="bar-fill bar-typed" id="barT" style="width:0%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Pasted</div>
                    <div class="stat-value" id="stPasted">0</div>
                    <div class="stat-sub" id="stPastedPct">0%</div>
                    <div class="bar-track"><div class="bar-fill bar-pasted" id="barP" style="width:0%"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- TASKS TAB -->
    <div class="tab-panel" id="panel-tasks">
        <div class="page-header">
            <h2>My Assignments</h2>
            <p id="classIdDisplay">Loading class assignments&#8230;</p>
        </div>
        <div id="tasksList"><div class="loading">Loading&#8230;</div></div>
    </div>
</div>

<script>
const API_BASE = "https://bluebook-gg5l.onrender.com";
// Auth
let user  = JSON.parse(localStorage.getItem('user'));
let token = localStorage.getItem('token');

if(!user || !token){ window.location.href='/'; }
else if(user.role !== 'student'){ alert('Please login as a student.'); window.location.href='/'; }

function authHeaders(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+token }; }
function logout(){ localStorage.clear(); window.location.href='/auth'; }

// Tabs
function showTab(name){
    ['editor','tasks'].forEach(t=>{
        document.getElementById('panel-'+t).classList.toggle('active', t===name);
        document.getElementById('tab-'+t).classList.toggle('active', t===name);
    });
    if(name==='tasks') loadTasks();
}

// Typing analytics
let typedCount=0, pastedCount=0;
let keystrokeTimestamps=[];
let backspaceCount=0;
let pauseCount=0;
let burstEvents=0;
let lastKeystrokeTime=null;
const PAUSE_THRESHOLD = 2000;
const BURST_THRESHOLD = 500;
let burstBuffer = [];

function recordKeystroke(charCount){
    let now = Date.now();
    if(lastKeystrokeTime !== null){
        let gap = now - lastKeystrokeTime;
        if(gap > PAUSE_THRESHOLD) pauseCount++;
        burstBuffer.push({time: now, chars: charCount});
        burstBuffer = burstBuffer.filter(e => now - e.time < BURST_THRESHOLD);
        let burstChars = burstBuffer.reduce((s,e)=>s+e.chars, 0);
        if(burstChars >= 5){ burstEvents++; burstBuffer = []; }
    }
    keystrokeTimestamps.push({time: now, chars: charCount});
    lastKeystrokeTime = now;
}

function computeTypingAnalytics(){
    if(keystrokeTimestamps.length < 2) return { avg_typing_speed:0, typing_variance:0 };
    let totalChars = keystrokeTimestamps.reduce((s,k)=>s+k.chars, 0);
    let totalTime  = (keystrokeTimestamps[keystrokeTimestamps.length-1].time - keystrokeTimestamps[0].time) / 1000;
    let avgSpeed   = totalTime > 0 ? totalChars / totalTime : 0;
    let intervals = [];
    for(let i=1; i<keystrokeTimestamps.length; i++){
        intervals.push(keystrokeTimestamps[i].time - keystrokeTimestamps[i-1].time);
    }
    let mean = intervals.reduce((s,v)=>s+v,0) / intervals.length;
    let variance = intervals.reduce((s,v)=>s+Math.pow(v-mean,2),0) / intervals.length;
    let stdDev   = Math.sqrt(variance) / 1000;
    return { avg_typing_speed: Math.round(avgSpeed*100)/100, typing_variance: Math.round(stdDev*1000)/1000 };
}

// Editor events
const editor = document.getElementById('editor');

editor.addEventListener('keydown', function(e){
    if(e.key === 'Backspace') backspaceCount++;
});

editor.addEventListener('input', function(e){
    if(e.inputType === 'insertText' && e.data){
        typedCount += e.data.length;
        recordKeystroke(e.data.length);
    } else if(e.inputType === 'insertParagraph'){
        recordKeystroke(1);
    }
});

editor.addEventListener('paste', function(e){
    e.preventDefault();
    let text = (e.clipboardData || window.clipboardData).getData('text');
    pastedCount += text.length;
    let escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    document.execCommand('insertHTML', false, '<span class="pasted">'+escaped+'</span>');
    document.getElementById('stats').innerHTML = "<span class='warning'>Pasted content detected and highlighted</span>";
});

// Toolbar helpers
function fmt(cmd){ editor.focus(); document.execCommand(cmd,false,null); }

function formatBlock(tag){
    if(!tag) return;
    editor.focus();
    document.execCommand('formatBlock',false,tag);
}

function setFontSize(size){
    if(!size) return;
    editor.focus();
    let sel=window.getSelection();
    if(sel && sel.rangeCount){
        let range=sel.getRangeAt(0);
        if(!range.collapsed){
            let span=document.createElement('span');
            span.style.fontSize=size;
            try{ range.surroundContents(span); } catch(e){}
        }
    }
}

function setColor(color){ editor.focus(); document.execCommand('foreColor',false,color); }

function triggerImageUpload(){ document.getElementById('imgUpload').click(); }

function insertImage(input){
    if(!input.files || !input.files[0]) return;
    let reader = new FileReader();
    reader.onload = function(e){
        editor.focus();
        let imgHTML = '<img src="'+e.target.result+'" style="max-width:100%;border-radius:6px;margin:8px 0;display:block;">';
        document.execCommand('insertHTML', false, imgHTML);
    };
    reader.readAsDataURL(input.files[0]);
    input.value='';
}

// Submit
function submitAssignment(){
    let contentHTML = editor.innerHTML.trim();
    let contentText = editor.innerText.trim();
    let assignmentId = document.getElementById('assignmentId').value;

    if(!assignmentId || !contentText){
        document.getElementById('stats').innerHTML="<span class='warning'>Please fill in the assignment ID and write your response.</span>";
        return;
    }

    let analytics = computeTypingAnalytics();

    fetch(`${API_BASE}/submit`,{
        method:'POST',
        headers: authHeaders(),
        body: JSON.stringify({
            student_id       : user.id,
            assignment_id    : parseInt(assignmentId),
            content          : contentHTML,
            typed_count      : typedCount,
            pasted_count     : pastedCount,
            avg_typing_speed : analytics.avg_typing_speed,
            typing_variance  : analytics.typing_variance,
            pause_count      : pauseCount,
            backspace_count  : backspaceCount,
            burst_events     : burstEvents,
        })
    })
    .then(r=>r.json())
    .then(data=>{
        if(data.detail){
            document.getElementById('stats').innerHTML="<span class='warning'>"+data.detail+"</span>";
            return;
        }
        let total = typedCount+pastedCount;
        let tp = total===0?0:((typedCount/total)*100).toFixed(1);
        let pp = total===0?0:((pastedCount/total)*100).toFixed(1);
        document.getElementById('stats').innerHTML="<span class='success'>&#10003; Submitted successfully</span>";
        document.getElementById('stTyped').innerText=typedCount;
        document.getElementById('stTypedPct').innerText=tp+'%';
        document.getElementById('barT').style.width=tp+'%';
        document.getElementById('stPasted').innerText=pastedCount;
        document.getElementById('stPastedPct').innerText=pp+'%';
        document.getElementById('barP').style.width=pp+'%';
        document.getElementById('statsCard').classList.add('visible');
    })
    .catch(()=>{ document.getElementById('stats').innerHTML="<span class='warning'>Submission failed. Please try again.</span>"; });
}

// My Tasks
function loadTasks(){
    let classId = user.class_id;
    let disp = document.getElementById('classIdDisplay');
    if(!classId){
        disp.innerText='No class ID linked to your account.';
        document.getElementById('tasksList').innerHTML='<div class="empty-state"><h3>No class assigned</h3><p>Ask your teacher for a Class ID and re-register with it to receive assignments.</p></div>';
        return;
    }
    disp.innerText='Class: '+classId;

    fetch(`${API_BASE}/assignments/class/`+encodeURIComponent(classId), { headers: authHeaders() })
    .then(r=>r.json())
    .then(data=>{
        let list = document.getElementById('tasksList');
        if(!data || data.length===0){
            list.innerHTML='<div class="empty-state"><h3>No assignments yet</h3><p>Your teacher hasn\'t posted any assignments for '+classId+' yet.</p></div>';
            return;
        }
        list.innerHTML='';
        let today=new Date(); today.setHours(0,0,0,0);
        data.forEach(a=>{
            let isOpen=true, warn='', deadlineLabel=a.deadline||'No deadline';
            if(a.deadline){
                let dl=new Date(a.deadline); dl.setHours(0,0,0,0);
                isOpen=today<=dl;
                let diff=Math.ceil((dl-today)/(1000*60*60*24));
                if(isOpen&&diff<=3) warn='<span class="deadline-warn">&#9888; Due in '+diff+' day'+(diff===1?'':'s')+'</span>';
            }
            list.innerHTML+=`
            <div class="assign-card">
                <div class="assign-info">
                    <div class="assign-title">${a.title}</div>
                    <div class="assign-meta">
                        <span>ID: ${a.id}</span>
                        <span>Max: ${a.max_marks}</span>
                        <span>${deadlineLabel}</span>
                        ${warn}
                    </div>
                </div>
                <div class="assign-right">
                    <span class="assign-badge ${isOpen?'badge-open':'badge-closed'}">${isOpen?'Open':'Closed'}</span>
                    ${isOpen?`<button class="assign-use-btn" onclick="useAssignment(${a.id})">Write Response</button>`:''}
                </div>
            </div>`;
        });
    })
    .catch(()=>{ document.getElementById('tasksList').innerHTML='<div class="loading">Could not load assignments.</div>'; });
}

function useAssignment(id){
    document.getElementById('assignmentId').value=id;
    showTab('editor');
